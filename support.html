<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support</title>
  <link rel="stylesheet" href="styles/support.css">
</head>
<body>
  <div class="background">

    <div class="top-bar">
      <h3>Support</h3>
    </div>

    <div class="content">
      <div class="content">
  <div class="card-wrapper">
    <img src="icons/ace.png" alt="Ace card" class="ace-card">
  </div>

  <div class="support-card">
    <p>If you enjoy the platform, you can support it in the ways below:</p>
    <div class="support-options">
      <button id="donate-btn">Donate</button>
      <button id="tip-btn">Send Tip</button>
      <button id="feedback-btn">Feedback</button>
    </div>
  </div>
</div>

    <div class="main-tools">
      <img src="icons/home.png" class="icons" id="home-page">
      <img src="icons/search.png" class="icons" id="explore-page">
      <img src="icons/cube.png" class="icons" id="share-idea-page">
      <img src="icons/envelope.png" class="icons" id="inbox-page">
      <img src="icons/user.png" class="icons" id="my-page">
    </div>

  </div>

  <script src="scripts/support.js"></script>
</body>
</html>
