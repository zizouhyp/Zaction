<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Friend</title>
  <link rel="stylesheet" href="styles/add-freind.css">
</head>
<body>
  <div class="header">
    <input type="text" id="search" placeholder="Search username...">
  </div>

  <div class="container">
    <div class="orbital">
      <div class="core">
        <span>add you freind</span>
      </div>

      <div class="orbit">
        <div class="line"></div>

        <div class="bobble-wrap b1">
          <img class="bobble" class="icons" style="filter: invert(100%);"src="icons/user.png">
        </div>
        <div class="bobble-wrap b2">
          <img class="bobble" class="icons" style="filter: invert(100%);"src="icons/cube.png">
        </div>
        <div class="bobble-wrap b3">
          <img class="bobble" class="icons" style="filter: invert(100%);"src="icons/paper-plane.png">
        </div>
        <div class="bobble-wrap b4">
          <img class="bobble" class="icons" style="filter: invert(100%);"src="icons/gift.png">
        </div>
        <div class="bobble-wrap b5">
          <img class="bobble" src="icons/delete.png">
        </div>
        <div class="bobble-wrap b6">
          <img class="bobble" src="icons/share.png">
        </div>
      </div>
    </div>
    <div class="more-info">
      <h1>More info!</h1>
      <fieldset>
        <legend>in web dev</legend>
        this website is made in one week,
        and its fully handmade with visual studio
      </fieldset>
    </div>
  </div>

  <script src="script/add-freind.js"></script>
</body>
</html>
