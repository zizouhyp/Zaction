<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Inbox</title>
  <link rel="stylesheet" href="styles/inbox.css">
</head>
<body>
  <div class="screen">

    <div class="top-menu">
      <img src="icons/back.png" class="icon" id="return">
      <h2>Inbox</h2>
    </div>

    <div class="page">
      
      <div class="add-fr">
        <h1 class="txt">Add  + freind</h1>
      </div>
      <div class="friend" data-user="alex">
        <img src="icons/user.png" class="icon" class="pfp">
        <div class="friend-info">
          <span class="name">Alex</span>
          <span class="last-msg">Hey, how are you?</span>
        </div>
        <span class="time">18:42</span>
      </div>

      <div class="friend" data-user="sarah">
        <img src="icons/user.png" class="icon" class="pfp">
        <div class="friend-info">
          <span class="name">Sarah</span>
          <span class="last-msg">See you tomorrow</span>
        </div>
        <span class="time">17:10</span>
      </div>

    </div>
  </div>

  <script src="scripts/inbox.js"></script>
</body>
</html>
