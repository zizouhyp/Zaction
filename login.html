<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="styles/login.css">
  <title>Login</title>
</head>
<body>
  <div class="background">
    <div class="prof">
      <div class="ico">
        <img class="icons" src="icons/user.png" height="40px">
        <h1 id="login-greeting">Welcome Back!</h1>
      </div>
      <div class="inputs">
        <input type="text" placeholder="your name" class="inpu" id="username">
        <div class="passwords-inp">
          <input type="password" placeholder="your password" class="inpu" id="password">
          <img height="30px" src="icons/eye.png" class="icons" id="togglePassword">
        </div>
        <div class="policity">
          <p>Don't have an account? <a id="signup" href="singin.html">Sign-up here</a></p>
          <div class="sub-1">
            <button class="submit-btn" id="login">Login</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="scripts/login.js"></script>
</body>
</html>
