<html>
<head>

        <div class="policity">
          <p>make sure that you read all <a id="terms" href="terms.html">terms of policity</a> and agree to them
            <input type="checkbox" id="agree"> I agree
          </p>
          <div class="sub-1">
            <p>- - - - - - -</p>
             <p>after giving us info you have to</p>
            <button class="submit-btn" id="submit">sumbit</button>
           </div>
        </div>
      </div>
      
    </div>
    
    
    
  </div>
  <script src="scripts/singin.js"></script>
</body>
</html>
